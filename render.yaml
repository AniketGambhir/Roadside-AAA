databases:
  - name: roadside-aaa-db
    plan: free
    region: singapore
    databaseName: roadside_aaa_db
    user: roadside_aaa_db_user

services:
  - type: web
    name: roadside-aaa
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: aniketgambhir10@gmail.com
      - key: DATABASE_URL
        fromDatabase:
          name: roadside-aaa-db
          property: connectionString